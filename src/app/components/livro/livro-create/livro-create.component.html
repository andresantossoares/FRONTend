<mat-card class="livro-card">
  <mat-card-title>Novo Livro</mat-card-title>

  <form class="centered-form">
    <mat-form-field class="full-width-field">
      <input matInput placeholder="Nome do livro" [(ngModel)]="livro.liNome" name="liNome">
    </mat-form-field>

    <mat-form-field class="full-width-field">
      <input matInput placeholder="Descrição do livro" [(ngModel)]="livro.liDescricao" name="liDescricao">
    </mat-form-field>

    <mat-form-field class="full-width-field">
      <input matInput placeholder="Avaliação" [(ngModel)]="livro.liAvaliacao" name="liAvaliacao">
    </mat-form-field>

    <mat-form-field class="full-width-field">
      <input matInput placeholder="Número de páginas" [(ngModel)]="livro.liNumeroPagi" name="liNumeroPagi">
    </mat-form-field>
    
    <mat-form-field class="full-width-field">
      <mat-label>Selecione o Fornecedor</mat-label>
      <mat-select [(ngModel)]="fornecedorSelecionado" (selectionChange)="onFornecedorChange($event.value)" name="fornecedor">
        <mat-option [value]="null">Nenhum fornecedor selecionado</mat-option>
        <mat-option *ngFor="let fornecedor of fornecedores" [value]="fornecedor">
          {{ fornecedor.forNomeFantasia }} - {{ fornecedor.forRazaoSocial }}
        </mat-option>
      </mat-select>
    </mat-form-field>
    
    <mat-form-field class="full-width-field">
      <input matInput placeholder="Nome fantasia do fornecedor" [(ngModel)]="livro.forNomeFantasia" name="forNomeFantasia" readonly>
    </mat-form-field>
    <mat-form-field class="full-width-field">
      <input matInput placeholder="CNPJ do fornecedor" [(ngModel)]="livro.forCnpj" name="forCnpj" readonly>
    </mat-form-field>
    <mat-form-field class="full-width-field">
      <input matInput placeholder="Razão social do fornecedor" [(ngModel)]="livro.forRazaoSocial" name="forRazaoSocial" readonly>
    </mat-form-field>

    <div class="button-container">
      <button mat-raised-button class="salvar-btn" (click)="createLivro()">
        Salvar
      </button>

      <button mat-raised-button class="cancelar-btn" (click)="cancel()">
        Cancelar
      </button>
    </div>
  </form>
</mat-card>
