<mat-toolbar class="header" met-elevation-z4>
    <button mat-icon-button (click)="toggleSidenav()" class="menu-btn">
        <mat-icon>menu</mat-icon>
    </button>
    <span class="title-group">
        <a>
            <i class="material-icons">
                local_library
            </i>
            Biblioteca
        </a>
    </span>
    <span class="spacer"></span>
    <button mat-icon-button (click)="toggleTheme()" class="theme-btn" matTooltip="{{isLight ? 'Tema Escuro' : 'Tema Claro'}}">
        <mat-icon>{{isLight ? 'dark_mode' : 'light_mode'}}</mat-icon>
    </button>
</mat-toolbar>
