<div class="table-container">
  <!-- Botão Novo Fornecedor -->
  <button mat-raised-button class="botao-novo" routerLink="/fornecedor/create">
    <mat-icon>local_shipping</mat-icon>
    Novo Fornecedor
  </button>

  <!-- Barra de Busca -->
  <div class="search-bar">
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Buscar</mat-label>
      <input matInput [(ngModel)]="filterValue" (keyup)="aplicarFiltro()" placeholder="Buscar por nome fantasia, CNPJ ou razão social...">
      <mat-icon matPrefix>search</mat-icon>
      <button mat-icon-button matSuffix *ngIf="filterValue" (click)="limparFiltro()" aria-label="Limpar">
        <mat-icon>close</mat-icon>
      </button>
    </mat-form-field>
  </div>

  <!-- Tabela -->
  <div class="mat-elevation-z4">
    <table mat-table [dataSource]="dataSource" matSort class="tabela">
      
      <ng-container matColumnDef="forId">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Id</th>
        <td mat-cell *matCellDef="let row">{{row.forId}}</td>
      </ng-container>
  
      <ng-container matColumnDef="forNomeFantasia">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Nome Fantasia</th>
        <td mat-cell *matCellDef="let row">{{row.forNomeFantasia}}</td>
      </ng-container>
  
      <ng-container matColumnDef="forCnpj">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>CNPJ</th>
        <td mat-cell *matCellDef="let row">{{row.forCnpj}}</td>
      </ng-container>
  
      <ng-container matColumnDef="forRazaoSocial">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Razão Social</th>
        <td mat-cell *matCellDef="let row">{{row.forRazaoSocial}}</td>
      </ng-container>
     
      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef>Ações</th>                    
        <td mat-cell *matCellDef="let row">
          <a [routerLink]="['/fornecedor/update', row.forId]" class="edit">
            <i class="material-icons">edit</i>
          </a>
          
          <a [routerLink]="['/fornecedor/delete', row.forId]" class="delete">
            <i class="material-icons">delete</i>
          </a>
                   
        </td>
      </ng-container>
  
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <!-- Linha quando não há dados -->
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="displayedColumns.length">
          <div class="no-data">
            <mat-icon>inbox</mat-icon>
            <p>Nenhum fornecedor encontrado</p>
          </div>
        </td>
      </tr>
    </table>
  </div>
  
  <!-- Paginação -->
  <mat-paginator 
    #paginator
    [pageSizeOptions]="[5, 10, 20, 50]"
    [pageSize]="10"
    showFirstLastButtons>
  </mat-paginator>
</div>
