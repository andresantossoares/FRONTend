<mat-card class="cliente-card">
    <mat-card-title>Alterar Cliente</mat-card-title>
  

<form class="centered-form">
    <mat-form-field class="full-width-field">
      <input matInput placeholder="Nome do Cliente" [(ngModel)]="cliente.cliNome" name="cliNome">
    </mat-form-field>
    <mat-form-field class="full-width-field">
      <input matInput placeholder="CPF" [(ngModel)]="cliente.cliCpf" name="cliCpf" appMask="cpf" maxlength="14">
    </mat-form-field>
    <mat-form-field class="full-width-field">
      <input matInput placeholder="Celular" [(ngModel)]="cliente.conCelular" name="conCelular" appMask="celular" maxlength="15" required>
    </mat-form-field>
    <mat-form-field class="full-width-field">
      <input matInput placeholder="Telefone Comercial (opcional)" [(ngModel)]="cliente.conTelefoneComercial" name="conTelefoneComercial" appMask="telefone" maxlength="14">
    </mat-form-field>
    <mat-form-field class="full-width-field">
      <input matInput type="email" placeholder="Email" [(ngModel)]="cliente.conEmail" name="conEmail" required>
    </mat-form-field>
    <mat-form-field class="full-width-field">
      <input matInput placeholder="Rua" [(ngModel)]="cliente.endRua" name="endRua" required>
    </mat-form-field>
    <mat-form-field class="full-width-field">
      <input matInput type="number" placeholder="Número (opcional)" [(ngModel)]="cliente.endNumero" name="endNumero">
    </mat-form-field>
    <mat-form-field class="full-width-field">
      <input matInput placeholder="Cidade" [(ngModel)]="cliente.endCidade" name="endCidade" required>
    </mat-form-field>
    <mat-form-field class="full-width-field">
      <input matInput placeholder="Estado (UF)" [(ngModel)]="cliente.endEstado" name="endEstado" appMask="estado" maxlength="2" required>
    </mat-form-field>
    <mat-form-field class="full-width-field">
      <input matInput placeholder="CEP" [(ngModel)]="cliente.endCep" name="endCep" appMask="cep" maxlength="9" required>
    </mat-form-field>

    
    <button mat-raised-button (click)="updateCliente()" class="update-btn">
        Atualizar
    </button>
    
    <button mat-raised-button (click)="cancel()" class="cancelar-btn">
        Cancelar
    </button>
</form>
</mat-card>
