<div class="table-container">
  <!-- Botão Novo Cliente -->
  <button mat-raised-button class="botao-novo" routerLink="/cliente/create">
    <mat-icon>person_add</mat-icon>
    Novo Cliente
  </button>

  <!-- Barra de Busca -->
  <div class="search-bar">
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Buscar</mat-label>
      <input matInput [(ngModel)]="filterValue" (keyup)="aplicarFiltro()" placeholder="Buscar por nome, CPF ou ID...">
      <mat-icon matPrefix>search</mat-icon>
      <button mat-icon-button matSuffix *ngIf="filterValue" (click)="limparFiltro()" aria-label="Limpar">
        <mat-icon>close</mat-icon>
      </button>
    </mat-form-field>
  </div>

  <!-- Tabela -->
  <div class="mat-elevation-z4">
    <table mat-table [dataSource]="dataSource" matSort class="tabela">
      
      <ng-container matColumnDef="cliId">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Id</th>
        <td mat-cell *matCellDef="let row">{{row.cliId}}</td>
      </ng-container>

      <ng-container matColumnDef="cliCpf">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>CPF</th>
        <td mat-cell *matCellDef="let row">{{row.cliCpf}}</td>
      </ng-container>

      <ng-container matColumnDef="cliNome">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Nome</th>
        <td mat-cell *matCellDef="let row">{{row.cliNome}}</td>
      </ng-container>

      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef>Ações</th>                    
        <td mat-cell *matCellDef="let row">
          <a [routerLink]="['/cliente/update', row.cliId]" class="edit">
            <i class="material-icons">edit</i>
          </a>
          
          <a [routerLink]="['/cliente/delete', row.cliId]" class="delete">
            <i class="material-icons">delete</i>
          </a>
        </td>
      </ng-container>
  
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <!-- Linha quando não há dados -->
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="displayedColumns.length">
          <div class="no-data">
            <mat-icon>inbox</mat-icon>
            <p>Nenhum cliente encontrado</p>
          </div>
        </td>
      </tr>
    </table>
  </div>

  <!-- Paginação -->
  <mat-paginator 
    #paginator
    [pageSizeOptions]="[5, 10, 20, 50]"
    [pageSize]="10"
    showFirstLastButtons>
  </mat-paginator>
</div>
